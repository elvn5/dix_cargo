name: Deploy

on:
  push:
    branches:
      - main
      - release/*

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── Staging (main branch) ───────────────────────────────────────────────────
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    name: Deploy → Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (staging)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE }}:staging
          build-args: APP_VERSION=staging

      - name: Copy compose file to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          echo "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          n=0
          until scp -i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              docker-compose.prod.yml "$SSH_USER@$SSH_HOST:/opt/cargo_bot_staging/docker-compose.prod.yml"; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "scp failed after 5 attempts"
              exit 1
            fi
            echo "scp failed (attempt $n/5), retrying in 10s..."
            sleep 10
          done

      - name: Deploy staging on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/cargo_bot_staging

            cat > .env <<EOF
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            POSTGRES_USER=cargo_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=cargo_bot_staging
            POSTGRES_DB_KANT=cargo_bot_staging_kant
            DATABASE_URL=postgresql://cargo_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/cargo_bot_staging
            DATABASE_URL_KANT=postgresql://cargo_user:${{ secrets.POSTGRES_PASSWORD }}@postgres_kant:5432/cargo_bot_staging_kant
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ADMIN_COOKIE_SECRET=${{ secrets.ADMIN_COOKIE_SECRET }}
            ADMIN_PORT=3001
            IMAGE=${{ env.IMAGE }}:staging
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            n=0
            while true; do
              set +e
              docker compose -p cargo_staging -f docker-compose.prod.yml pull
              pull_status=$?
              set -e
              if [ "$pull_status" -eq 0 ]; then
                break
              fi
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "docker compose pull failed after 5 attempts"
                exit 1
              fi
              echo "docker compose pull failed (attempt $n/5), retrying in 10s..."
              sleep 10
            done

            docker compose -p cargo_staging -f docker-compose.prod.yml up -d
            docker image prune -f

  # ── Production (release/X.X.X branch) ─────────────────────────────────────
  deploy-production:
    if: startsWith(github.ref, 'refs/heads/release/')
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT

      - name: Build and push image (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.VERSION }}
          build-args: APP_VERSION=${{ steps.version.outputs.VERSION }}

      - name: Build and push backup image (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backup
          push: true
          tags: |
            ${{ env.IMAGE }}:backup-latest
            ${{ env.IMAGE }}:backup-${{ steps.version.outputs.VERSION }}

      - name: Copy compose file to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          echo "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          n=0
          until scp -i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              docker-compose.prod.yml "$SSH_USER@$SSH_HOST:/opt/cargo_bot_prod/docker-compose.prod.yml"; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "scp failed after 5 attempts"
              exit 1
            fi
            echo "scp failed (attempt $n/5), retrying in 10s..."
            sleep 10
          done

      - name: Deploy production on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/cargo_bot_prod

            cat > .env <<EOF
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            POSTGRES_USER=cargo_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=cargo_bot_prod
            POSTGRES_DB_KANT=cargo_bot_prod_kant
            DATABASE_URL=postgresql://cargo_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/cargo_bot_prod
            DATABASE_URL_KANT=postgresql://cargo_user:${{ secrets.POSTGRES_PASSWORD }}@postgres_kant:5432/cargo_bot_prod_kant
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ADMIN_COOKIE_SECRET=${{ secrets.ADMIN_COOKIE_SECRET }}
            ADMIN_PORT=3000
            IMAGE=${{ env.IMAGE }}:latest
            COMPOSE_PROFILES=backup
            BACKUP_IMAGE=${{ env.IMAGE }}:backup-latest
            GDRIVE_CLIENT_ID=${{ secrets.GDRIVE_CLIENT_ID }}
            GDRIVE_CLIENT_SECRET=${{ secrets.GDRIVE_CLIENT_SECRET }}
            GDRIVE_TOKEN='${{ secrets.GDRIVE_TOKEN }}'
            BACKUP_ALERT_CHAT_ID=${{ secrets.BACKUP_ALERT_CHAT_ID }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            n=0
            while true; do
              set +e
              docker compose -p cargo_prod -f docker-compose.prod.yml pull
              pull_status=$?
              set -e
              if [ "$pull_status" -eq 0 ]; then
                break
              fi
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "docker compose pull failed after 5 attempts"
                exit 1
              fi
              echo "docker compose pull failed (attempt $n/5), retrying in 10s..."
              sleep 10
            done

            docker compose -p cargo_prod -f docker-compose.prod.yml up -d
            docker image prune -f
