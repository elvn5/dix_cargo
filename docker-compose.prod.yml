services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cargo_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargo_user} -d ${POSTGRES_DB:-cargo_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    image: ${IMAGE}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET}
      ADMIN_PORT: ${ADMIN_PORT:-3000}
    ports:
      - "${ADMIN_PORT:-3000}:${ADMIN_PORT:-3000}"
    volumes:
      - marketplace_uploads:/app/uploads

volumes:
  postgres_data:
    driver: local
  marketplace_uploads:
    driver: local
