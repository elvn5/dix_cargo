# Логи docker (stdout/stderr контейнеров) с ротацией, чтобы не забить диск.
# Важно: при пересоздании контейнера (каждый деплой бота) docker logs обнуляются,
# поэтому постоянные журналы пишутся в тома: журнал действий бота — в app_logs,
# журнал изменений БД (INSERT/UPDATE/DELETE) — в каталог log внутри тома postgres.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

# Postgres пишет в файлы log/postgresql-ГГГГ-ММ-ДД.log (в томе с данными) все
# изменяющие запросы с параметрами и медленные (>1 с) запросы. Подключения не
# пишем — healthcheck подключается каждые 5 с и забил бы журнал.
x-postgres-command: &postgres-command
  - postgres
  - -c
  - logging_collector=on
  - -c
  - log_directory=log
  - -c
  - log_filename=postgresql-%Y-%m-%d.log
  - -c
  - log_rotation_age=1d
  - -c
  - log_rotation_size=0
  - -c
  - log_statement=mod
  - -c
  - log_min_duration_statement=1000
  - -c
  - "log_line_prefix=%m [%p] %u@%d %h "
  - -c
  - log_timezone=Asia/Bishkek

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    command: *postgres-command
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cargo_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargo_user} -d ${POSTGRES_DB:-cargo_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_kant:
    image: postgres:16-alpine
    restart: always
    command: *postgres-command
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_KANT:-cargo_bot_kant}
    volumes:
      - postgres_kant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargo_user} -d ${POSTGRES_DB_KANT:-cargo_bot_kant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    image: ${IMAGE}
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      postgres_kant:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_KANT: ${DATABASE_URL_KANT}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET}
      ADMIN_PORT: ${ADMIN_PORT:-3000}
      LOG_DIR: /app/logs
    ports:
      - "${ADMIN_PORT:-3000}:${ADMIN_PORT:-3000}"
    volumes:
      - marketplace_uploads:/app/uploads
      - app_logs:/app/logs
      - predeploy_dumps:/app/backups

  # Ежедневный зашифрованный бэкап обеих баз в S3-бакет, по умолчанию Cloudflare R2 (backup/backup.sh).
  # Включается профилем: COMPOSE_PROFILES=backup в .env (сейчас только прод).
  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/elvn5/dix_cargo:backup-latest}
    profiles: ["backup"]
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      postgres_kant:
        condition: service_healthy
    environment:
      TZ: Asia/Bishkek
      BACKUP_TIME: "03:00"
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_KANT: ${DATABASE_URL_KANT}
      S3_PROVIDER: ${S3_PROVIDER:-Cloudflare}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Публичный ключ age: расшифровать бэкап можно только приватным ключом, которого нет на сервере
      BACKUP_AGE_RECIPIENT: age1tdwr3ewn5h73x9p9x2qldprv4sk0hnm3dm3lagd42280r060n4qqzk3dz8
      BACKUP_KEEP_DAILY_DAYS: "14"
      BACKUP_KEEP_WEEKLY_DAYS: "62"
      BACKUP_KEEP_MONTHLY_DAYS: "365"
      # Алерт об ошибке в Telegram от бота; chat ID задаётся в админке → Настройки бота
      BOT_TOKEN: ${BOT_TOKEN}

volumes:
  postgres_data:
    driver: local
  postgres_kant_data:
    driver: local
  marketplace_uploads:
    driver: local
  app_logs:
    driver: local
  predeploy_dumps:
    driver: local
