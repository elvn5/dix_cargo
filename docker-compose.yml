services:
  # ─── PostgreSQL — филиал Бишкек ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cargo_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargo_password}
      POSTGRES_DB: ${POSTGRES_DB:-cargo_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargo_user} -d ${POSTGRES_DB:-cargo_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL — филиал Кант ───────────────────────────────
  postgres_kant:
    image: postgres:16-alpine
    container_name: cargo_bot_db_kant
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargo_password}
      POSTGRES_DB: ${POSTGRES_DB_KANT:-cargo_bot_kant}
    volumes:
      - postgres_kant_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargo_user} -d ${POSTGRES_DB_KANT:-cargo_bot_kant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Telegram Bot ────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cargo_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres_kant:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cargo_user}:${POSTGRES_PASSWORD:-cargo_password}@postgres:5432/${POSTGRES_DB:-cargo_bot}
      DATABASE_URL_KANT: postgresql://${POSTGRES_USER:-cargo_user}:${POSTGRES_PASSWORD:-cargo_password}@postgres_kant:5432/${POSTGRES_DB_KANT:-cargo_bot_kant}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dixcargo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET:-dix-super-secret}
      ADMIN_PORT: ${ADMIN_PORT:-3000}
    ports:
      - "${ADMIN_PORT:-3000}:3000"

volumes:
  postgres_data:
    driver: local
  postgres_kant_data:
    driver: local
